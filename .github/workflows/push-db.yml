name: Push Supabase Migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install psql and test IPv4 connection
        run: |
          CLEAN_URL=$(echo "$SUPABASE_DB_URL" | tr -d '[:space:]"')
          if [ -z "$CLEAN_URL" ]; then echo "ERROR: SUPABASE_DB_URL secret is empty!"; exit 1; fi
          if ! echo "$CLEAN_URL" | grep -qE '^postgres(ql)?://[^:]+:[^@]+@[^/]+:[0-9]+/'; then
            echo "ERROR: SUPABASE_DB_URL is not a valid postgresql://user:pass@host:port/db URI!"
            echo "Starts with postgres(ql)://? $(echo "$CLEAN_URL" | grep -qE '^postgres(ql)?://' && echo YES || echo NO)"
            echo "Contains pooler.supabase.com? $(echo "$CLEAN_URL" | grep -q 'pooler.supabase.com' && echo YES || echo NO)"
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$CLEAN_URL" -c "SELECT 1;"
      - name: Run all migrations in order
        run: |
          CLEAN_URL=$(echo "$SUPABASE_DB_URL" | tr -d '[:space:]"')
          for f in $(ls supabase/migrations/*.sql | sort -V); do
            echo "=== Running $f ==="
            psql "$CLEAN_URL" -f "$f"
          done
          echo "=== Verifying Tables ==="
          psql "$CLEAN_URL" -c "\dt public.*"
          psql "$CLEAN_URL" -c "SELECT count(*) AS districts_count FROM public.codenagari_districts;"
          
