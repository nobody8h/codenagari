name: Push Supabase Migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref yhrftedopnpwwhzuulfd
      - run: |
          if ! supabase db push --linked --yes; then
            FIRST_VER=$(ls supabase/migrations | head -n 1 | cut -d'_' -f1)
            supabase migration repair --status applied "$FIRST_VER" --linked --yes || supabase migration repair --status applied "$FIRST_VER" --remote --yes
            supabase db push --linked --yes
          fi
          
