name: Push Supabase Migrations

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install psql and test IPv4 connection
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "ERROR: SUPABASE_DB_URL secret is empty!"; exit 1; fi
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$SUPABASE_DB_URL" -c "SELECT 1;"
      - name: Run all migrations in order
        run: |
          for f in $(ls supabase/migrations/*.sql | sort -V); do
            echo "=== Running $f ==="
            psql "$SUPABASE_DB_URL" -f "$f"
          done
          echo "=== Verifying Tables ==="
          psql "$SUPABASE_DB_URL" -c "\dt public.*"
          psql "$SUPABASE_DB_URL" -c "SELECT count(*) AS districts_count FROM public.codenagari_districts;"
          
